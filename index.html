<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Country- project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-cyan-600">
    <nav class="fixed top-0 z-50 w-full bg-cyan-600 shadow-md px-4 md:px-8 py-4">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 max-w-7xl mx-auto">
            <h1 class="text-2xl md:text-4xl font-black uppercase text-white">Nation<span
                    class="text-cyan-300">hub</span></h1>
            <div class="flex w-full md:w-[40%] items-center">
                <div class="relative w-full"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"
                        class="lucide lucide-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                        aria-hidden="true">
                        <path d="m21 21-4.34-4.34"></path>
                        <circle cx="11" cy="11" r="8"></circle>
                    </svg><input id="searchInput" placeholder="Search nations..."
                        class="w-full bg-white text-black pl-12 pr-4 py-3 rounded-full shadow-md focus:outline-none focus:ring-2 focus:ring-amber-400"
                        type="text" value=""></div>
            </div>

            <div class="flex items-center gap-3"><button id="countryCount"
                    class="bg-cyan-300 text-black px-4 py-2 rounded-full font-bold shadow">0</button>
                <div class="relative w-36 md:w-48">
                    <button id="regionToggle" type="button" aria-expanded="false" aria-controls="regionMenu"
                        class="flex items-center justify-between gap-2 w-full bg-cyan-300 text-black font-black py-3 px-4 rounded-3xl shadow-lg">
                        <span id="selectedRegion">Regions</span>
                        <span aria-hidden="true">▾</span>
                    </button>

                    <div id="regionMenu"
                        class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl overflow-hidden z-50">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="countryContainer"
        class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 p-10 mt-40 justify-items-center">

    </div>

    <div class="flex justify-center items-center gap-2 mt-10 mb-10 flex-wrap">

        <div class="flex justify-center mt-10 mb-10">
            <div id="pageButtons" class="flex flex-wrap justify-center gap-2"></div>
        </div>

        <button id="lastBtn" class="bg-gray-200 px-4 py-2 rounded">
        </button>

    </div>



    <div id="detailsPopup" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">

        <div class="bg-white w-full max-w-md rounded-xl shadow-lg p-6 max-h-[90vh] overflow-y-auto">

            <button onclick="closeDetails()" class="float-right text-red-500 text-3xl font-bold">
                &times;
            </button>

            <div id="countryDetails"></div>

        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
